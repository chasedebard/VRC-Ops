<svg id="kyoto-map-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="kyoto-map-title kyoto-map-desc">
  <title id="kyoto-map-title">Kyoto Driving Park Yamagiwa plus Miyabi circuit map</title>
  <desc id="kyoto-map-desc">Clean vector circuit map with interactive sectors, turns, braking zones, elevation zones, speed zones, and start finish marker.</desc>
  <style>
    #kyoto-map-svg {
      --map: #f5f7f4;
      --track: #101217;
      --muted: #7d8792;
      --selected: #ff7a1a;
      --sector-1: #2dd4bf;
      --sector-2: #8b5cf6;
      --sector-3: #22c55e;
      --brake: #ef4444;
      --elevation: #0ea5e9;
      background: var(--map);
    }

    .track-shadow {
      fill: none;
      stroke: rgba(15, 23, 42, 0.16);
      stroke-width: 36;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .track-line {
      fill: none;
      stroke: var(--track);
      stroke-width: 22;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .track-inner {
      fill: none;
      stroke: #fefefe;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.16;
    }

    .track-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 72;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: stroke;
    }

    .sector-path {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.68;
      pointer-events: stroke;
    }

    .sector-one {
      stroke: var(--sector-1);
    }

    .sector-two {
      stroke: var(--sector-2);
    }

    .sector-three {
      stroke: var(--sector-3);
    }

    .zone-region {
      opacity: 0.72;
      pointer-events: stroke;
    }

    .zone-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .braking-zone .zone-line {
      stroke: var(--brake);
      stroke-width: 10;
      stroke-dasharray: 2 22;
    }

    .elevation-zone .zone-line {
      stroke: var(--elevation);
      stroke-width: 12;
      stroke-dasharray: 18 14;
    }

    .speed-zone .zone-line {
      stroke: var(--sector-1);
      stroke-width: 7;
      opacity: 0.82;
    }

    .turn-dot,
    .marker-core {
      fill: #ffffff;
      stroke: var(--track);
      stroke-width: 3;
    }

    .turn-text,
    .marker-text,
    .sector-text {
      fill: var(--track);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .turn-text {
      font-size: 20px;
    }

    .marker-text {
      font-size: 18px;
    }

    .sector-pill {
      fill: rgba(255, 255, 255, 0.86);
      stroke: rgba(17, 24, 39, 0.18);
      stroke-width: 1.5;
    }

    .sector-text {
      font-size: 18px;
    }

    .apex {
      fill: #ffffff;
      stroke: var(--selected);
      stroke-width: 3;
      opacity: 0.88;
    }

    .sf-line {
      stroke: #ffffff;
      stroke-width: 24;
      stroke-linecap: round;
    }

    .sf-line-dark {
      stroke: var(--track);
      stroke-width: 5;
      stroke-linecap: round;
    }
  </style>
  <rect x="12" y="12" width="976" height="776" rx="28" fill="var(--map)"/>

  <g id="elevation-overlay">
    <g id="elevation-zone-1" class="zone-region elevation-zone" data-region-id="elevation-zone-1">
      <path class="zone-line" d="M 770 136 C 712 134 652 126 590 111"/>
    </g>
    <g id="elevation-zone-2" class="zone-region elevation-zone" data-region-id="elevation-zone-2">
      <path class="zone-line" d="M 125 233 C 182 283 247 365 309 475"/>
